# ERSoundBankLoader config for the Nightfarers profile (build_sfx.sh fills BANK_DIR and copies it beside the DLL).
[general]
enabled=true
log_enabled=true

[runtime]
start_delay_ms=5000
conditional_enabled=true
condition_hand=auto
poll_every_frames=6
unload_when_inactive=true

[bank_files]
memory_copy_enabled=true
bank_file_dir=BANK_DIR

[fallback_startup_preload]
retries_per_id=120
retry_every_frames=60

[conditional_bank_mappings]
condition_bank_mapping=GROUP:BANK_ID
